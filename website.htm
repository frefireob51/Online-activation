<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gullkhan Pro</title>
<style>
/* ===== Global Styles ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    scroll-behavior: smooth;
}

/* ===== Section Styles ===== */
section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
    position: relative;
    padding: 20px;
}

section.hero {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

section.features {
    background: linear-gradient(135deg, #1f4037, #99f2c8);
    color: #000;
}

section.contact {
    background: linear-gradient(135deg, #42275a, #734b6d);
}

/* ===== Hero Section ===== */
h1 {
    font-size: 4em;
    text-transform: uppercase;
    letter-spacing: 5px;
    background: linear-gradient(90deg, #ffdd00, #ff0055, #00ffee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textSlide 4s infinite alternate;
    margin-bottom: 20px;
}

@keyframes textSlide {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

p.hero-text {
    font-size: 1.5em;
    margin-bottom: 40px;
    animation: fadeIn 3s ease-in-out infinite alternate;
}

@keyframes fadeIn {
    0% { opacity: 0.4; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
}

.button {
    padding: 15px 40px;
    font-size: 1.2em;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(90deg, #ff0055, #ffdd00);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255,255,255,0.2);
}

.button:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 25px rgba(255,255,255,0.3);
    background: linear-gradient(90deg, #00ffee, #ff0055);
}

/* ===== Features Section ===== */
.features h2 {
    font-size: 3em;
    margin-bottom: 20px;
}

.feature-box {
    width: 200px;
    height: 200px;
    margin: 20px;
    border-radius: 20px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5em;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff0055, #ffdd00, #00ffee);
    background-size: 300% 300%;
    animation: gradientShift 6s ease-in-out infinite alternate;
    transition: transform 0.3s ease;
}

.feature-box:hover {
    transform: scale(1.1) rotate(10deg);
}

@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
}

/* ===== Contact Section ===== */
.contact h2 {
    font-size: 3em;
    margin-bottom: 20px;
}

.contact p {
    font-size: 1.2em;
    margin-bottom: 20px;
}

.contact .email {
    font-weight: bold;
    font-size: 1.2em;
    color: #ffdd00;
}

/* ===== Scroll Down Indicator ===== */
.scroll-down {
    position: absolute;
    bottom: 20px;
    font-size: 2em;
    animation: bounce 2s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-15px); }
    60% { transform: translateY(-7px); }
}

/* ===== Responsive ===== */
@media(max-width: 768px){
    h1 { font-size: 2.5em; }
    p.hero-text { font-size: 1em; }
    .feature-box { width: 150px; height: 150px; font-size: 1em; margin: 10px; }
}
</style>
</head>
<body>

<!-- ===== Hero Section ===== -->
<section class="hero">
    <h1>Gullkhan Pro</h1>
    <p class="hero-text">Welcome to the modern & interactive website!</p>
    <button class="button" onclick="alert('Button Clicked!')">Get Started</button>
    <div class="scroll-down">⌄</div>
</section>

<!-- ===== Features Section ===== -->
<section class="features">
    <h2>Our Features</h2>
    <div class="feature-box">Fast</div>
    <div class="feature-box">Secure</div>
    <div class="feature-box">Responsive</div>
</section>

<!-- ===== Contact Section ===== -->
<section class="contact">
    <h2>Contact Us</h2>
    <p>Send your queries to:</p>
    <p class="email">gullkhanpro@example.com</p>
</section>

</body>
</html>
